      - run:
          name: Map flash
          command: |
            printf 'size=16m\n' > flash.cfg
      - run:
          name: Build flasher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spiFlashErase -j2
      - run:
          name: Erase SPI sectors
